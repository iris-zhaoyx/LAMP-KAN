pretrained_model_path: "./checkpoints/stable-diffusion-v1-4"
output_dir: "./outputs/Arm_flapping"

train_data:
  video_root: "./data/training_videos/Arm_flapping"
  # prompt: "a man is skiing"
  n_sample_frames: 8
  width: 256
  height: 256
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  image_path: "benchmark/Arm_flapping"
  prompts:
    - "a baby flaps his arm with his back to the camera"
    - "a boy is flapping his arms outdoors"
    - "a girl dressed in blue flaps her arm"
    - "a little boy wearing an orange short sleeved shirt flapped his arm with his back to the camera"
    - "a little boy with black hair and a yellow shirt is flapping his arms indoors"
  video_length: 16
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: False
  num_inv_steps: 50

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 30000
checkpointing_steps: 10000
validation_steps: 50
trainable_modules:
  - "conv1d"
  - "attn1.to_q"
  - "conv_gate"
  - "attn_temp"
#  - "base_conv"
  - "spline_conv"
seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
