pretrained_model_path: "./checkpoints/stable-diffusion-v1-4"
output_dir: "./outputs/Finger_Flicking"

train_data:
  video_root: "./data/training_videos/Finger_Flicking"
  # prompt: "a man is skiing"
  n_sample_frames: 16
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  image_path: "benchmark/Finger_Flicking"
  prompts:
    - "a boy flicks his fingers outdoors"
    - "a boy sitting at a table flicking his fingers"
    - "a boy sitting on the floor flicking his fingers"
    - "a boy sitting on the sofa flicking his fingers"
    - "a girl sitting on the bed flicking her fingers"
  video_length: 16
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: False
  num_inv_steps: 100

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 5000
checkpointing_steps: 5000
validation_steps: 50
trainable_modules:
  - "conv1d"
  - "attn1.to_q"
  - "conv_gate"
  - "attn_temp"

seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
