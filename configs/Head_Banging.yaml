pretrained_model_path: "./checkpoints/stable-diffusion-v1-4"
output_dir: "./outputs/Head_Banging"

train_data:
  video_root: "./data/training_videos/Head_Banging"
  # prompt: "a man is skiing"
  n_sample_frames: 16
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  image_path: "benchmark/Head_Banging"
  prompts:
    - "a little boy bangs his head against the sofa"
    - "a little boy bangs his head against the wall"
    - "a little boy kneels on the floor and bangs his head against the floor"
    - "a little boy stands on the floor and bangs the door with his head"
    - "a little girl sits on a chair and bangs her head against the dining table"
  video_length: 16
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: False
  num_inv_steps: 50

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 5000
checkpointing_steps: 5000
validation_steps: 50
trainable_modules:
  - "conv1d"
  - "attn1.to_q"
  - "conv_gate"
  - "attn_temp"

seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
