pretrained_model_path: "./checkpoints/stable-diffusion-v1-4"
output_dir: "./outputs/Toe_Walking"

train_data:
  video_root: "./data/training_videos/Toe_Walking"
  # prompt: "a man is skiing"
  n_sample_frames: 8
  width: 256
  height: 256
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  image_path: "benchmark/Toe_Walking"
  prompts:
    - "a child in a red short sleeved shirt and blue shorts tiptoes barefoot along the corridor"
    - "a child tiptoes barefoot across the brick paved ground"
    - "a child tiptoes barefoot across the floorboards"
    - "a child tiptoes barefoot along the corridor"
    - "a child tiptoes barefoot around the room"
  video_length: 16
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: False
  num_inv_steps: 50

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 30000
checkpointing_steps: 10
validation_steps: 50
trainable_modules:
  - "conv1d"
  - "attn1.to_q"
  - "conv_gate"
  - "attn_temp"
  - "base_conv"
  - "spline_conv"

seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
